<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="rockPaper.css">
</head>
<body>
    <div id="header">
        <h1>Rock Paper Scissors</h1> 
    </div>
    <div id="container">
        <div id="boxHolder">
        <div class="box">👊</div>
        <div class="box">✋</div>
        <div class="box">✂️</div>
     </div>
     <h2><u>Score</u></h2>
     <div id="score">
        <div id="Player">
            <p><font>Player:</font></p>
            <br>
            <p><font>0</font></p>
        </div>
         <div id="Bot">
            <p><font>Bot:</font></p>
            <br>
            <p><font>0</font></p>
        </div>
     </div>
    </div>
    <script src="rockPaper.js"></script>
</body>
</html>
